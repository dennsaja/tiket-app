name: HelpDesk and Android 11 check
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DATABASE_URL: postgresql://fixture:fixture@127.0.0.1:1/unavailable
      AUTH_SECRET: github-fixture-not-a-production-secret-123456789
      # Old settings must not split this application again.
      APP_SERVICE: frontend
      SPLIT_DEPLOY_ENABLED: 'true'
      NEXT_PUBLIC_API_ORIGIN: https://unused-api.example
      NEXT_PUBLIC_CDN_ORIGIN: https://unused-cdn.example
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Test application boundaries and GitHub updater
        run: npx vitest run src/__tests__/monolith-network.test.ts src/__tests__/system-update.test.ts --maxWorkers=1
      - run: npm run build
      - name: Check web, login, API and assets in one process
        run: bash .github/scripts/monolith-check.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: app-results
          path: app-results/
  android11:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build Android verification APKs
        working-directory: android-technician
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest --no-daemon --max-workers=2
          test -s app/build/outputs/apk/debug/app-debug.apk
          test -s app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run Android 11 checks
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_3a
          # Playback deliberately respects reduced motion. Keep animation enabled
          # while checking that the bundled video starts and pauses correctly.
          disable-animations: false
          script: bash .github/scripts/android11-release-check.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android11-results
          path: qa-results/
