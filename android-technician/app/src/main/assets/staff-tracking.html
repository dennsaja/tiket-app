<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><link rel="stylesheet" href="leaflet.css"><style>
html,body,#map{height:100%;margin:0;background:#101014;font-family:system-ui}#tools{position:absolute;top:12px;left:12px;right:12px;z-index:900;display:flex;gap:5px}button,#status{background:#19191f;color:#fff;border:1px solid #33333d;border-radius:16px;padding:12px;font-size:12px}button.active{background:#4563ff}#status{position:absolute;bottom:18px;left:12px;right:48px;z-index:900;pointer-events:none}.leaflet-tooltip{border-radius:10px;font:11px system-ui}.leaflet-control-attribution{font-size:8px!important}
</style></head><body><div id="map"></div><div id="tools"><button id="streets" class="active" onclick="mode(false)">Peta</button><button id="satellite" onclick="mode(true)">Satelit</button><button onclick="fit()">Pusatkan tim</button></div><div id="status">Menunggu data lokasi…</div><script src="leaflet.js"></script><script src="satellite.js"></script><script>
var map=L.map('map',{zoomControl:false,minZoom:3,maxZoom:22,preferCanvas:true}).setView([-6.76,110.857],12);L.control.zoom({position:'bottomright'}).addTo(map);map.attributionControl.setPrefix(false);
var streets=L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxNativeZoom:19,maxZoom:22,attribution:'© OpenStreetMap'}), satellite=createHelpdeskSatelliteLayer(L), active=streets.addTo(map), dataLayer=L.layerGroup().addTo(map),bounds=[],first=true,lastData=null;
function mode(sat){map.removeLayer(active);map.setMaxZoom(sat?19:22);active=sat?satellite:streets;active.addTo(map);document.getElementById('streets').className=sat?'':'active';document.getElementById('satellite').className=sat?'active':'';}
function fit(){if(bounds.length)map.fitBounds(bounds,{padding:[35,70],maxZoom:16});}
function label(value){var span=document.createElement('span');span.textContent=value;return span;}
window.renderTracking=function(payload){lastData=payload;dataLayer.clearLayers();bounds=[];var topology=payload.topology||{},locations=payload.locations||{},colors={server:'#0ea5e9',router:'#a78bfa',odp:'#f59e0b',customer:'#10b981'},live=0;
(topology.links||[]).forEach(function(link){if(link.coordinates&&link.coordinates.length>1)L.polyline(link.coordinates.map(function(p){return[p[1],p[0]]}),{color:colors[link.kind]||'#10b981',weight:3,opacity:.9,dashArray:link.traced?null:'5 6'}).addTo(dataLayer)});
(topology.nodes||[]).forEach(function(node){var p=[node.coordinates[1],node.coordinates[0]];bounds.push(p);L.circleMarker(p,{radius:node.kind==='customer'?3:5,color:'#fff',weight:1,fillColor:colors[node.kind],fillOpacity:1}).bindTooltip(label(node.name)).addTo(dataLayer)});
(locations.tickets||[]).forEach(function(ticket){if(ticket.latitude==null||ticket.longitude==null)return;L.circleMarker([ticket.latitude,ticket.longitude],{radius:6,color:'#fff',weight:2,fillColor:'#ff996a',fillOpacity:1}).bindTooltip(label('#'+ticket.ticketNumber+' '+ticket.title)).addTo(dataLayer)});
(locations.technicians||[]).forEach(function(tech){if(tech.latitude==null||tech.longitude==null)return;var p=[tech.latitude,tech.longitude],fresh=tech.isTracking&&Date.now()-Date.parse(tech.updatedAt)<360000;bounds.push(p);if(fresh)live++;L.circleMarker(p,{radius:10,color:'#fff',weight:3,fillColor:fresh?'#4563ff':'#7a7a86',fillOpacity:1}).bindTooltip(label(tech.name+(fresh?' · GPS terbaru':' · lokasi terakhir')),{permanent:true,direction:'top'}).addTo(dataLayer)});
document.getElementById('status').textContent=live+' GPS terbaru · '+(topology.links||[]).length+' jalur · '+new Date().toLocaleTimeString('id-ID');if(first&&bounds.length){first=false;fit();}};
active.on('tileerror',function(){document.getElementById('status').textContent='Gambar peta belum termuat. Periksa koneksi; titik dan jalur tetap ditampilkan.'});
</script></body></html>
