# Local origin gateway for Cloudflare Tunnel. Keep this listener private.
# Route all three public hostnames to http://127.0.0.1:8080 in the tunnel.
server {
    listen 127.0.0.1:8080 default_server;
    server_name _;
    return 404;
}
server {
    listen 127.0.0.1:8080;
    server_name helpdesk.infinityteknik.net;
    client_max_body_size 120m;
    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host helpdesk.infinityteknik.net;
        proxy_set_header X-Forwarded-Host helpdesk.infinityteknik.net;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_read_timeout 3600;
    }
}
server {
    listen 127.0.0.1:8080;
    server_name kds-serviceapp.infinityteknik.net;
    client_max_body_size 120m;
    location / {
        proxy_pass http://127.0.0.1:3101;
        proxy_http_version 1.1;
        proxy_set_header Host kds-serviceapp.infinityteknik.net;
        proxy_set_header X-Forwarded-Host kds-serviceapp.infinityteknik.net;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_cache off;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "private, no-store, no-transform" always;
        proxy_read_timeout 3600;
    }
}
server {
    listen 127.0.0.1:8080;
    server_name cdn0.infinityteknik.net;
    root /var/lib/helpdesk/cdn/public;
    autoindex off;
    add_header Access-Control-Allow-Origin "*" always;
    add_header Cross-Origin-Resource-Policy cross-origin always;
    add_header X-Content-Type-Options nosniff always;
    location ~ (^|/)\. { return 404; }
    location ~ ^/(api|uploads|\.next/server)(/|$) { return 404; }
    location /_next/static/ {
        alias /var/lib/helpdesk/cdn/_next/static/;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cross-Origin-Resource-Policy cross-origin always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }
    location /downloads/ {
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "public, max-age=0, must-revalidate, no-transform" always;
        try_files $uri =404;
    }
    location / {
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "public, max-age=300" always;
        try_files $uri =404;
    }
}
